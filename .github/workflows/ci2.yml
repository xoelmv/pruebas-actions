name: ci2

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CADA_MIN: 30

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w ci2.yml -e workflow_dispatch -L 20 --json status \
                -q '[.[] | select(.status != "completed")] | length')
          echo "$n"
          if [ "$n" -eq 0 ]; then gh workflow run ci2.yml -R "$GITHUB_REPOSITORY" --ref main; fi

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: build2
      cancel-in-progress: false
    steps:
      - name: Next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ci2.yml/enable" || true
          for i in 1 2 3 4 5; do
            gh workflow run ci2.yml -R "$GITHUB_REPOSITORY" --ref main && break
            sleep 30
          done
          h=$(TZ=Europe/Madrid date +%-H)
          if [ "$h" -ge 8 ] && [ "$h" -lt 13 ]; then gh workflow run report.yml -R "$GITHUB_REPOSITORY" --ref main || true; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - uses: actions/checkout@v4
        with:
          ref: datos2
          path: d
          filter: blob:none
          sparse-checkout: i

      - uses: actions/cache/restore@v4
        with:
          path: p
          key: p-${{ github.run_id }}
          restore-keys: p-

      - name: Run
        id: run
        env:
          API_URL2: ${{ secrets.API_URL2 }}
        run: |
          git -C d config user.name "github-actions[bot]"
          git -C d config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=$(( CADA_MIN * 60 ))
          siguiente=$(( ( $(date +%s) / p + 1 ) * p ))
          sleep $(( siguiente - $(date +%s) ))
          if python run2.py --dir d --prev p/prev.json.gz; then
            git -C d add --sparse -A .
            git -C d commit -q -m "update"
            for intento in 1 2 3; do
              if git -C d push -q; then echo "ok=1" >> "$GITHUB_OUTPUT"; break; fi
              git -C d pull --rebase -q || true
            done
          fi

      - uses: actions/cache/save@v4
        if: steps.run.outputs.ok == '1'
        with:
          path: p
          key: p-${{ github.run_id }}
